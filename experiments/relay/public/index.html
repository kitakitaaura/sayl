<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayl relay test</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #0d9488; --bad: #dc2626; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #e7e5e4; --muted: #a8a29e; --line: #292524; --accent: #2dd4bf; --bad: #f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  label { display: block; margin: 14px 0 4px; color: var(--muted); }
  input, select, textarea, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  button { margin-top: 20px; background: var(--accent); color: var(--bg); border: 0; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 24px 0 8px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #status { min-height: 1.5em; }
  pre { background: var(--line); padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 360px; }
  .bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Sayl relay test</h1>
  <p>A BitTorrent client running in this page. Cloudflare only relays its TCP connections; files go straight to your disk.</p>

  <label for="source">Magnet link</label>
  <textarea id="source" placeholder="magnet:?xt=urn:btih:…"></textarea>
  <label for="file">or a .torrent file</label>
  <input id="file" type="file" accept=".torrent,application/x-bittorrent">

  <div class="row">
    <div>
      <label for="via">Relay through</label>
      <select id="via"><option value="worker">Worker</option><option value="do">Durable Object</option></select>
    </div>
    <div>
      <label for="peers">Max peers</label>
      <input id="peers" type="number" min="1" max="200" value="40">
    </div>
    <div>
      <label for="mode">Mode</label>
      <select id="mode"><option value="save">Save the file</option><option value="test">Speed test (don't save)</option></select>
    </div>
    <div>
      <label for="limit">Stop after (MB, speed test)</label>
      <input id="limit" type="number" min="1" value="200">
    </div>
  </div>
  <label for="token">Relay token (if the relay has one)</label>
  <input id="token" type="password" autocomplete="off">

  <button id="start">Start</button>

  <div class="bar"><div id="fill"></div></div>
  <div id="status">idle</div>
  <pre id="log"></pre>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
