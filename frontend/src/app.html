<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0c0d" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <script>
      // apply the saved theme before first paint (key and shape match lib/state/settings.svelte.ts)
      (function () {
        var root = document.documentElement;
        try {
          var s = JSON.parse(localStorage.getItem('sayl.settings') || '{}');
          var t = s.theme === 'auto' || s.theme === 'light' ? s.theme : 'dark';
          if (t !== 'auto') root.setAttribute('data-theme', t);
          if (s.reduceMotion === true) root.classList.add('rm');
        } catch (e) {
          root.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
