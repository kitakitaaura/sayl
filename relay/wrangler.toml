name = "sayl-relay"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "Session"

# Free-plan accounts can only use SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Session"]

# To require ?token=… on every tunnel, set a secret: npx wrangler secret put ACCESS_TOKEN
[vars]
# "1" lets the relay reach private addresses. Only for local testing.
ALLOW_PRIVATE_TARGETS = "0"
# The DHT needs a TURN account (see worker/index.js, turnCredentials). For Metered:
#   npx wrangler secret put METERED_APP          (the part before .metered.live)
#   npx wrangler secret put METERED_SECRET_KEY
# Without one, downloads still work; they just can't use the DHT.
# TURN servers the relay may reach (gives the browser UDP, for the DHT). Comma-separated;
# "*.example.com" allows its subdomains. Workers can't reach Cloudflare's own TURN servers,
# so this needs a provider outside Cloudflare.
TURN_HOSTS = "*.relay.metered.ca,*.metered.live,global.xirsys.net"
